<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Interface Sync app icon (original artwork, MIT licence). Two arrows form a loop around a keycap:
    settings going round between PCs. No letters, fonts, logos or game artwork.
    Rebuild the .ico files with: python3 assets/icon/generate.py
  -->
  <defs>
    <g id="half">
      <!-- top arc, 200° to 340° on a circle of radius 23 round (32,32), with an arrowhead at its end -->
      <path d="M10.39 24.13 A23 23 0 0 1 53.61 24.13" fill="none" stroke="#2F80ED" stroke-width="6.5"/>
      <polygon points="56.0,30.71 59.51,19.86 46.35,24.64" fill="#2F80ED"/>
    </g>
  </defs>
  <use xlink:href="#half"/>
  <use xlink:href="#half" transform="rotate(180 32 32)"/>
  <!-- keycap: body and top face -->
  <rect x="19.5" y="19.5" width="25" height="25" rx="5.5" fill="#263238" stroke="#CFD8DC" stroke-width="2"/>
  <rect x="22.5" y="21.5" width="19" height="16.5" rx="3.5" fill="#607D8B"/>
  <!-- BADGE -->
</svg>
