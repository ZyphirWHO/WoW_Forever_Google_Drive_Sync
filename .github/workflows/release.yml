name: release

# Releases are built only here, from this repository: never by hand.
#  - Push a tag like v3.0.0 (or v3.0.0-beta.1 for a pre-release) to build, package and, after an approver
#    approves the "release" environment, publish a GitHub Release.
#  - Run it manually (Actions -> release -> Run workflow) for a dry run: build and package only, nothing published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else { $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1 }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Version: $v"

      - name: Build and test
        run: dotnet test --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/InterfaceSync.App/InterfaceSync.App.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false `
            -p:EnableCompressionInSingleFile=false -p:PublishTrimmed=false -p:DebugType=none `
            -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Check product name
        shell: pwsh
        run: ./.github/check-product-name.ps1 publish

      - name: Upload unsigned exe
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: publish/
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # SIGNING (insert here once the SignPath Foundation approves the project; not active yet)
  #
  # sign:
  #   needs: build
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: signpath/github-action-submit-signing-request@v1
  #       with:
  #         api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
  #         organization-id: <from SignPath>
  #         project-slug: <from SignPath>
  #         signing-policy-slug: release-signing
  #         github-artifact-id: ${{ needs.build.outputs.artifact-id }}
  #         wait-for-completion: true
  #         output-artifact-directory: signed
  #     - uses: actions/upload-artifact@v4
  #       with: { name: signed, path: signed/ }
  #
  # Then make "package" need [build, sign] and download "signed" instead of "unsigned".
  # ---------------------------------------------------------------------------------------------

  package:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unsigned
          path: publish

      - name: Check product name
        shell: pwsh
        run: ./.github/check-product-name.ps1 publish

      - name: Build and test the installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $props = [xml](Get-Content Directory.Build.props)
          $name = $props.Project.PropertyGroup.ProductDisplayName | Where-Object { $_ } | Select-Object -First 1
          $id = $props.Project.PropertyGroup.ProductId | Where-Object { $_ } | Select-Object -First 1
          & $iscc /Q "/DAppName=$name" "/DAppId=$id" "/DAppVersion=${{ needs.build.outputs.version }}" "/DSourceDir=$PWD\publish" "/O$PWD\installer" packaging\windows\InterfaceSync.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          ./.github/test-installer.ps1 installer

      - name: Zip and hash
        shell: pwsh
        run: |
          $v = "${{ needs.build.outputs.version }}"
          $id = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.ProductId | Where-Object { $_ } | Select-Object -First 1
          $name = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.ProductDisplayName | Where-Object { $_ } | Select-Object -First 1
          New-Item -ItemType Directory out | Out-Null
          $stage = "stage/$id"
          New-Item -ItemType Directory $stage -Force | Out-Null
          Copy-Item "publish/$id.exe", README.md, LICENSE "$stage/"
          Copy-Item docs/ANTIVIRUS.md "$stage/ANTIVIRUS.md"
          Copy-Item packaging/guides/windows.html "$stage/How to open $name.html"
          Copy-Item assets/fonts/OFL-Cinzel.txt "$stage/"
          Copy-Item "publish/$id.exe" "out/$id.exe"
          Compress-Archive -Path "$stage/*" -DestinationPath "out/$id-$v.zip"
          $exeHash = (Get-FileHash "out/$id.exe" -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash "out/$id-$v.zip" -Algorithm SHA256).Hash
          Copy-Item "installer/$id-Setup-$v.exe" "out/"
          $setupHash = (Get-FileHash "out/$id-Setup-$v.exe" -Algorithm SHA256).Hash
          @"
          $name $v

          Built by GitHub Actions from commit $env:GITHUB_SHA of this repository, with a build-provenance attestation.

          | File | SHA-256 |
          |---|---|
          | $id.exe | ``$exeHash`` |
          | $id-Setup-$v.exe (installer, recommended) | ``$setupHash`` |
          | $id-$v.zip | ``$zipHash`` |

          Check the file before running it: in PowerShell, ``Get-FileHash .\$id.exe`` must show the SHA-256 above.
          If Windows or your browser warns about it, open "How to open $name.html" in the zip; for antivirus warnings see ANTIVIRUS.md.

          World of Warcraft and Warcraft are trademarks or registered trademarks of Blizzard Entertainment, Inc., in the U.S. and/or other countries. $name is not affiliated with or endorsed by Blizzard Entertainment.
          "@ -replace '(?m)^          ', '' | Set-Content out/release-notes.md -Encoding utf8
          Get-Content out/release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: out/
          retention-days: 30

  # The Mac app (Apple silicon and Intel): disk images and zips, ad-hoc signed (not notarised yet).
  macos:
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Mac tests
        run: |
          dotnet test tests/InterfaceSync.Core.Tests --configuration Release
          dotnet test tests/InterfaceSync.Mac.Tests --configuration Release
      - name: Build the .app, .dmg and .zip
        run: |
          packaging/macos/make-app.sh osx-arm64 "${{ needs.build.outputs.version }}" out
          packaging/macos/make-app.sh osx-x64 "${{ needs.build.outputs.version }}" out
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: |
            out/*.dmg
            out/*.zip
          retention-days: 30

  publish:
    # Only for tags. The "release" environment must have required reviewers (Settings -> Environments),
    # so every release waits for an approver.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, package, macos]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: macos-package
          path: out

      # The updater checks every download against GitHub's own digest, or against this table.
      - name: Add the Mac files to the release notes
        run: |
          {
            echo ""
            echo "| Mac file | SHA-256 |"
            echo "|---|---|"
            for f in out/*.dmg out/*.zip; do
              case "$f" in *macos*) echo "| $(basename "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |" ;; esac
            done
            echo ""
            echo "On a Mac: open the .dmg for your Mac (arm64 for Apple silicon, x64 for Intel) and drag Interface Sync onto Applications."
          } >> out/release-notes.md
          cat out/release-notes.md

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/*.exe
            out/*.zip
            out/*.dmg

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" out/*.zip out/*.exe out/*.dmg \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file out/release-notes.md $prerelease
