name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and test
        run: dotnet test --configuration Release

      # Pictures of the windows in both themes, for reviewing the look (uploaded below, and printed so they can
      # be read from the log).
      - name: Window screenshots
        shell: pwsh
        env:
          INTERFACESYNC_SCREENSHOTS: ${{ github.workspace }}/screenshots
        run: |
          dotnet test tests/InterfaceSync.App.Tests --configuration Release --no-build --filter Screenshots_for_review
          Get-ChildItem screenshots/*.png | ForEach-Object {
            "SCREENSHOT-BEGIN $($_.Name)"
            [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            "SCREENSHOT-END"
          }

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: InterfaceSync-screenshots-${{ github.sha }}
          path: screenshots/
          retention-days: 14

      # One self-contained exe: no trimming, no compression, no self-extraction of native files.
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/InterfaceSync.App/InterfaceSync.App.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false `
            -p:EnableCompressionInSingleFile=false -p:PublishTrimmed=false -p:DebugType=none `
            -o publish
          Get-ChildItem publish | Format-Table Name, Length

      # The product name is set once in Directory.Build.props. Fail if the exe disagrees (SignPath requires the
      # product name attributes to match the project name in every build).
      - name: Check product name
        shell: pwsh
        run: ./.github/check-product-name.ps1 publish

      # The download holds the exe and the "How to open" guide (SmartScreen / browser warnings).
      - name: Add the guide
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifact | Out-Null
          Copy-Item publish/* artifact/
          Copy-Item packaging/guides/windows.html "artifact/How to open Interface Sync.html"
          Copy-Item assets/fonts/OFL-Cinzel.txt artifact/

      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: InterfaceSync-dev-${{ github.sha }}
          path: artifact/
          retention-days: 14

  # macOS: Core and Mac app tests on a real Mac, then the menu-bar app for Apple silicon and Intel.
  macos:
    # Intel runner: GitHub's arm64 macOS runners were unavailable ("not acquired ... after multiple attempts").
    # Both the arm64 and x64 apps are still built here.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Core tests on macOS
        run: dotnet test tests/InterfaceSync.Core.Tests --configuration Release
      - name: Mac app tests (headless)
        run: dotnet test tests/InterfaceSync.Mac.Tests --configuration Release
      - name: Build the .app (arm64 and x64)
        run: |
          VERSION=$(python3 -c "import xml.etree.ElementTree as E; print(next(e.text for e in E.parse('Directory.Build.props').getroot().iter('Version')))")
          packaging/macos/make-app.sh osx-arm64 "$VERSION" out
          packaging/macos/make-app.sh osx-x64 "$VERSION" out
      - name: Upload macOS development build
        uses: actions/upload-artifact@v4
        with:
          name: InterfaceSync-macos-dev-${{ github.sha }}
          path: out/*.zip
          retention-days: 14
