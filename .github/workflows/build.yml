name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and test
        run: dotnet test --configuration Release

      # Pictures of the windows in both themes, for reviewing the look (uploaded below, and printed so they can
      # be read from the log).
      - name: Window screenshots
        shell: pwsh
        env:
          INTERFACESYNC_SCREENSHOTS: ${{ github.workspace }}/screenshots
        run: |
          dotnet test tests/InterfaceSync.Desktop.Tests --configuration Release --no-build --filter Screenshots_for_review
          Get-ChildItem screenshots/*.png | ForEach-Object {
            "SCREENSHOT-BEGIN $($_.Name)"
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            for ($i = 0; $i -lt $b64.Length; $i += 4000) { $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i)) }   # long log lines are dropped
            "SCREENSHOT-END"
          }

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: InterfaceSync-screenshots-${{ github.sha }}
          path: screenshots/
          retention-days: 14

      # One self-contained exe: no trimming, no compression, no self-extraction of native files.
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/InterfaceSync.Desktop/InterfaceSync.Desktop.csproj -f net8.0-windows10.0.19041.0 -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=false -p:PublishTrimmed=false -p:DebugType=none `
            "-p:InformationalVersion=$((([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1))-dev.${{ github.run_number }}" `
            -o publish
          Get-ChildItem publish | Format-Table Name, Length

      # The product name is set once in Directory.Build.props. Fail if the exe disagrees (SignPath requires the
      # product name attributes to match the project name in every build).
      - name: Check product name
        shell: pwsh
        run: ./.github/check-product-name.ps1 publish

      # Per-user installer (Inno Setup): built, then installed, checked and uninstalled on this runner.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $props = [xml](Get-Content Directory.Build.props)
          $name = $props.Project.PropertyGroup.ProductDisplayName | Where-Object { $_ } | Select-Object -First 1
          $id = $props.Project.PropertyGroup.ProductId | Where-Object { $_ } | Select-Object -First 1
          $v = $props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          & $iscc /Q "/DAppName=$name" "/DAppId=$id" "/DAppVersion=$v" "/DSourceDir=$PWD\publish" "/O$PWD\installer" packaging\windows\InterfaceSync.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem installer | ForEach-Object { "$($_.Name)  SHA-256: $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" }

      - name: Test installer (install, check, uninstall)
        timeout-minutes: 10
        shell: pwsh
        run: ./.github/test-installer.ps1 installer

      # The download holds the exe and the "How to open" guide (SmartScreen / browser warnings).
      - name: Add the guide
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifact | Out-Null
          Copy-Item publish/* artifact/
          Copy-Item packaging/guides/windows.html "artifact/How to open Interface Sync.html"
          Copy-Item assets/fonts/OFL-Cinzel.txt artifact/

      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: InterfaceSync-dev-${{ github.sha }}
          path: artifact/
          retention-days: 14

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: InterfaceSync-Setup-dev-${{ github.sha }}
          path: installer/*.exe
          retention-days: 14

  # macOS: Core and Mac app tests on a real Mac, then the menu-bar app for Apple silicon and Intel.
  macos:
    # Intel runner: GitHub's arm64 macOS runners were unavailable ("not acquired ... after multiple attempts").
    # Both the arm64 and x64 apps are still built here.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Core tests on macOS
        run: dotnet test tests/InterfaceSync.Core.Tests --configuration Release
      - name: App tests (headless)
        run: dotnet test tests/InterfaceSync.Desktop.Tests --configuration Release
      - name: Build the .app (arm64 and x64)
        run: |
          VERSION=$(python3 -c "import xml.etree.ElementTree as E; print(next(e.text for e in E.parse('Directory.Build.props').getroot().iter('Version')))")
          packaging/macos/make-app.sh osx-arm64 "$VERSION" out "$VERSION-dev.${{ github.run_number }}"
          packaging/macos/make-app.sh osx-x64 "$VERSION" out "$VERSION-dev.${{ github.run_number }}"
      - name: Upload macOS development build
        uses: actions/upload-artifact@v4
        with:
          name: InterfaceSync-macos-dev-${{ github.sha }}
          path: |
            out/*.zip
            out/*.dmg
          retention-days: 14

  # Test builds: every green build on main becomes a GitHub pre-release "v<version>-dev.<run>", so the app's
  # updater can bring test builds up to the newest one (published releases never see these). Only the newest 3
  # test builds are kept.
  test-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, macos]
    runs-on: ubuntu-latest
    concurrency:
      group: test-build-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: InterfaceSync-dev-${{ github.sha }}
          path: dl/windows
      - uses: actions/download-artifact@v4
        with:
          name: InterfaceSync-Setup-dev-${{ github.sha }}
          path: dl/setup
      - uses: actions/download-artifact@v4
        with:
          name: InterfaceSync-macos-dev-${{ github.sha }}
          path: dl/macos

      - name: Name the files after the test build's version
        id: files
        run: |
          set -euo pipefail
          prop() { python3 -c "import sys, xml.etree.ElementTree as E; print(next(e.text for e in E.parse('Directory.Build.props').getroot().iter(sys.argv[1]) if e.text))" "$1"; }
          ID=$(prop ProductId); NAME=$(prop ProductDisplayName); BASE=$(prop Version)
          V="$BASE-dev.${{ github.run_number }}"
          mkdir out
          cp "dl/windows/$ID.exe" "out/$ID.exe"
          cp dl/setup/*.exe "out/$ID-Setup-$V.exe"
          for f in dl/macos/*; do
            n=$(basename "$f"); cp "$f" "out/${n/$ID-$BASE-/$ID-$V-}"
          done
          ls -l out
          {
            echo "Test build of $NAME, made by GitHub Actions from commit ${GITHUB_SHA} (run ${{ github.run_number }})."
            echo "It is not a release: only test builds update to it. Releases are published separately."
            echo ""
            echo "| File | SHA-256 |"
            echo "|---|---|"
            for f in out/*; do echo "| $(basename "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"; done
          } > notes.md
          cat notes.md
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Publish the test build and keep only the newest 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.files.outputs.version }}"
          gh release create "v$V" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Test build $V" --notes-file notes.md
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-dev\\.")))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r old; do
            echo "Removing old test build $old"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
