name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and test
        run: dotnet test --configuration Release

      # One self-contained exe: no trimming, no compression, no self-extraction of native files.
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/InterfaceSync.App/InterfaceSync.App.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false `
            -p:EnableCompressionInSingleFile=false -p:PublishTrimmed=false -p:DebugType=none `
            -o publish
          Get-ChildItem publish | Format-Table Name, Length

      # The product name is set once in Directory.Build.props. Fail if the exe disagrees (SignPath requires the
      # product name attributes to match the project name in every build).
      - name: Check product name
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props)
          $name = ($props.Project.PropertyGroup | Where-Object { $_.ProductDisplayName }).ProductDisplayName
          $id = ($props.Project.PropertyGroup | Where-Object { $_.ProductId }).ProductId
          $files = Get-ChildItem publish
          if ($files.Count -ne 1 -or $files[0].Name -ne "$id.exe") { throw "Publish must produce only $id.exe, found: $($files.Name -join ', ')" }
          $info = (Get-Item "publish/$id.exe").VersionInfo
          "ProductName: $($info.ProductName)  FileDescription: $($info.FileDescription)  CompanyName: $($info.CompanyName)  Version: $($info.ProductVersion)"
          if ($info.ProductName -ne $name) { throw "ProductName '$($info.ProductName)' differs from '$name'" }
          if ($info.FileDescription -ne $name) { throw "FileDescription '$($info.FileDescription)' differs from '$name'" }
          if ($info.InternalName -ne "$id.dll" -and $info.OriginalFilename -ne "$id.dll") { throw "Internal/original file name doesn't match $id" }
          "SHA-256: $((Get-FileHash "publish/$id.exe" -Algorithm SHA256).Hash)"

      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: InterfaceSync-dev-${{ github.sha }}
          path: publish/
          retention-days: 14
